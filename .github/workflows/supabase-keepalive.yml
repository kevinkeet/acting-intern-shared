# Keeps the Supabase project awake for the TEACH-AI study period.
# Free-tier projects pause after ~7 days without API activity; a resident
# who opens a case against a paused database sees a dead site. This pings
# the public REST endpoint twice a day using the site's public anon key,
# read live from index.html so no secret is stored here.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 3,15 * * *"   # 03:17 and 15:17 UTC, every day
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST with the public anon key
        run: |
          set -euo pipefail
          KEY=$(curl -fsS https://actingintern.com/index.html | grep -o "__SUPABASE_ANON_KEY = '[^']*'" | cut -d"'" -f2)
          test -n "$KEY" || { echo "anon key not found in index.html"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "https://piwoinyrlicvndpsmtde.supabase.co/rest/v1/user_settings?select=id&limit=1")
          echo "Supabase responded $CODE"
          test "$CODE" = "200"
